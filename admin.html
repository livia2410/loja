<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Área da loja</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
const KEY='lp_cfg';
const ls={get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}},del(){try{localStorage.removeItem(KEY)}catch(e){}}};
let CFG=ls.get(),S=null,SHA='',tab='prods',editId=null,isNew=false,D=null,dirty=false;const PREV={};
const im=p=>PREV[p]||p;

async function gh(path,opt={}){
  const r=await fetch(`https://api.github.com/repos/${CFG.user}/${CFG.repo}/contents/${path}`,{...opt,headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json'}});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(r.status+' '+m)}
  return r.json();
}
async function load(){const j=await gh('produtos.json');SHA=j.sha;S=JSON.parse(unb64(j.content))}

function loginView(msg){
  CFG=CFG||{user:'',repo:'',token:''};
  $('app').innerHTML=`<div class="top"><h1>Área da loja</h1></div>
  <p class="muted">Entre uma vez com seus dados do GitHub. Eles ficam salvos só neste aparelho.</p>
  <label>Usuário do GitHub</label><input type="text" id="u" value="${esc(CFG.user)}" autocapitalize="none">
  <label>Nome do repositório</label><input type="text" id="r" value="${esc(CFG.repo)}" autocapitalize="none">
  <label>Token de acesso</label><input type="password" id="t" value="${esc(CFG.token)}">
  ${msg?`<p class="err">${esc(msg)}</p>`:''}
  <button class="send" onclick="entrar()">Entrar</button>`;
}
async function entrar(){
  CFG={user:$('u').value.trim(),repo:$('r').value.trim(),token:$('t').value.trim()};
  try{await load();ls.set(CFG);renderAdm()}catch(e){loginView('Não consegui entrar ('+e.message+'). Confira usuário, repositório e token.')}
}
function sair(){if(dirty&&!confirm('Há alterações não publicadas. Sair mesmo assim?'))return;ls.del();CFG=null;S=null;loginView()}

function setDirty(){dirty=true;const b=$('pubBtn');if(b){b.disabled=false;b.textContent='Publicar alterações'}}
function goTab(t){tab=t;editId=null;renderAdm()}
function renderAdm(){
  let h=`<div class="top"><h1>${esc(S.loja)}</h1><div><a class="mini" style="text-decoration:none;display:inline-block;border-radius:10px" href="index.html" target="_blank">Ver loja</a> <button class="mini" onclick="sair()">Sair</button></div></div>
  <div class="tabs">${[['prods','Produtos'],['cats','Categorias'],['loja','Loja']].map(([k,n])=>`<button class="${tab==k&&!editId?'on':''}" onclick="goTab('${k}')">${n}</button>`).join('')}</div>`;
  h+=editId?formProd():tab=='prods'?listProd():tab=='cats'?listCats():formLoja();
  h+=`<div class="pub"><button class="send" id="pubBtn" onclick="publicar()" ${dirty?'':'disabled'}>${dirty?'Publicar alterações':'Tudo publicado ✓'}</button></div>`;
  $('app').innerHTML=h;
}
const catName=id=>(S.cats.find(c=>c.id==id)||{nome:'Sem categoria'}).nome;
function listProd(){
  return `<button class="send" style="margin-top:0" onclick="newProd()">+ Novo produto</button>`+S.prods.map(p=>`<div class="row"><div style="display:flex;gap:10px;align-items:center;min-width:0">${p.imgs[0]?`<img src="${esc(im(p.imgs[0]))}" alt="">`:'<span style="font-size:28px">🌸</span>'}<div><strong>${esc(p.nome)}</strong><br><small class="muted">${brl(p.preco)} · ${esc(catName(p.cat))}${p.esgotado?' · esgotado':''}</small></div></div>
   <div style="white-space:nowrap"><button class="mini" onclick="editProd('${p.id}')">Editar</button> <button class="mini red" onclick="delProd('${p.id}')">Excluir</button></div></div>`).join('')||'<p class="muted">Nenhum produto ainda. Toque em “Novo produto”.</p>';
}
function newProd(){D={id:uid(),nome:'',preco:'',cat:(S.cats[0]||{}).id||'',desc:'',detalhes:'',imgs:[],esgotado:false};editId=D.id;isNew=true;renderAdm()}
function editProd(id){D=JSON.parse(JSON.stringify(S.prods.find(p=>p.id==id)));editId=id;isNew=false;renderAdm()}
function delProd(id){if(!confirm('Excluir este produto?'))return;S.prods=S.prods.filter(p=>p.id!=id);setDirty();renderAdm()}
function formProd(){
  const ths=D.imgs.map((p,i)=>`<div class="th"><img src="${esc(im(p))}" alt=""><button onclick="rmImg(${i})">✕</button>${i?`<button class="st" onclick="mainImg(${i})">★ principal</button>`:'<span class="st">principal</span>'}</div>`).join('');
  return `<h3 style="margin:0">${isNew?'Novo produto':'Editar produto'}</h3>
  <label>Nome</label><input type="text" value="${esc(D.nome)}" oninput="D.nome=this.value">
  <label>Preço (R$)</label><input type="text" inputmode="decimal" value="${esc(D.preco)}" oninput="D.preco=this.value">
  <label>Categoria</label><select onchange="D.cat=this.value"><option value="">Sem categoria</option>${S.cats.map(c=>`<option value="${c.id}" ${D.cat==c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>
  <label>Descrição curta (aparece no card)</label><input type="text" value="${esc(D.desc)}" oninput="D.desc=this.value">
  <label>Descrição completa</label><textarea rows="5" oninput="D.detalhes=this.value">${esc(D.detalhes)}</textarea>
  <label>Fotos</label><div class="ths">${ths}</div>
  <input type="file" accept="image/*" multiple onchange="addImgs([...this.files]);this.value=''"><div id="upst" class="muted"></div>
  <label class="sm"><input type="checkbox" ${D.esgotado?'checked':''} onchange="D.esgotado=this.checked"> Produto esgotado</label>
  <button class="send" onclick="saveProd()">Salvar produto</button><button class="close" onclick="editId=null;renderAdm()">Cancelar</button>`;
}
function rmImg(i){D.imgs.splice(i,1);renderAdm()}
function mainImg(i){D.imgs.unshift(D.imgs.splice(i,1)[0]);renderAdm()}
function shrink(f,max=1000){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
async function addImgs(fs){
  for(let i=0;i<fs.length;i++){const st=$('upst');if(st)st.textContent=`Enviando foto ${i+1} de ${fs.length}…`;
    try{const d=await shrink(fs[i]),path='fotos/'+uid()+'.jpg';
      await gh(path,{method:'PUT',body:JSON.stringify({message:'Nova foto',content:d.split(',')[1]})});
      PREV[path]=d;D.imgs.push(path);setDirty()}catch(e){alert('Não consegui enviar uma das fotos ('+e.message+').')}}
  renderAdm();
}
function saveProd(){
  const pr=parseFloat(String(D.preco).replace(',','.'));
  if(!D.nome.trim()){alert('Dê um nome ao produto.');return}
  if(isNaN(pr)){alert('Informe o preço, por exemplo 59,90.');return}
  D.nome=D.nome.trim();D.preco=pr;
  const i=S.prods.findIndex(p=>p.id==D.id);if(i>=0)S.prods[i]=D;else S.prods.push(D);
  editId=null;setDirty();renderAdm();
}
function listCats(){
  return `<p class="muted" style="margin-top:0">As categorias viram botões de filtro no topo da loja (ex.: We Pink, Maquiagem, Roupas).</p>`+S.cats.map(c=>`<div class="row"><input type="text" value="${esc(c.nome)}" onchange="renCat('${c.id}',this.value)" style="margin:0"><button class="mini red" onclick="delCat('${c.id}')">Excluir</button></div>`).join('')+
  `<label>Nova categoria</label><input type="text" id="newCat" placeholder="Ex.: Roupas"><button class="send" onclick="addCat()">Adicionar categoria</button>`;
}
function addCat(){const n=$('newCat').value.trim();if(!n)return;S.cats.push({id:uid(),nome:n});setDirty();renderAdm()}
function renCat(id,v){const c=S.cats.find(x=>x.id==id);if(c&&v.trim()){c.nome=v.trim();setDirty()}}
function delCat(id){if(!confirm('Excluir a categoria? Os produtos dela ficam sem categoria.'))return;S.cats=S.cats.filter(c=>c.id!=id);S.prods.forEach(p=>{if(p.cat==id)p.cat=''});setDirty();renderAdm()}
function formLoja(){
  return `<label>Nome da loja</label><input type="text" value="${esc(S.loja)}" oninput="S.loja=this.value;setDirty()">
  <label>WhatsApp (com DDD)</label><input type="text" inputmode="tel" value="${esc(S.whatsapp)}" oninput="S.whatsapp=this.value.replace(/\\D/g,'');setDirty()">
  <label>Valor da embalagem de presente (R$, 0 = grátis)</label><input type="text" inputmode="decimal" value="${esc(S.taxaPresente)}" oninput="S.taxaPresente=parseFloat(this.value.replace(',','.'))||0;setDirty()">`;
}
async function publicar(){
  const b=$('pubBtn');b.disabled=true;b.textContent='Publicando…';
  try{const r=await gh('produtos.json',{method:'PUT',body:JSON.stringify({message:'Atualiza catálogo',content:b64(JSON.stringify(S,null,1)),sha:SHA})});
    SHA=r.content.sha;dirty=false;b.textContent='Publicado ✓ (aparece na loja em cerca de 1 minuto)'}
  catch(e){b.disabled=false;b.textContent='Não deu certo ('+e.message+'). Tentar de novo'}
}
if(CFG&&CFG.token){load().then(renderAdm).catch(e=>loginView('Não consegui entrar ('+e.message+').'))}else loginView();
</script>
</body>
</html>
